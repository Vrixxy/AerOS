[workspace]
members = ["kernel"]
exclude = ["userspace/init", "userspace/std-smoke", "userspace/fork-probe", "userspace/threads", "userspace/ptrace", "userspace/swap", "userspace/bench", "tools/aml-host", "compat/agent"]
resolver = "3"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
